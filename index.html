<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 경제 여권 · 사회 어휘 3단계 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EC;
  --paper:#FFFFFF;
  --ink:#1B2B33;
  --ink-soft:#5B6B72;
  --navy:#1B3A4B;
  --navy-2:#0F2733;
  --gold:#E3A23D;
  --gold-dark:#B9791F;
  --green:#2F8F63;
  --green-bg:#E7F5EE;
  --red:#BF4E3C;
  --red-bg:#FBEAE6;
  --line:#E7DFC9;
  --s1:#3F72AF;
  --s2:#8A5FBF;
  --s3:#2F8F63;
  --radius:20px;
  --shadow: 0 10px 30px rgba(15,39,51,0.12);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 10% -10%, #EFF3EA 0%, transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, #F3EADA 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  min-height:100%;
  display:flex;
  justify-content:center;
  padding:28px 16px 60px;
}
h1,h2,h3,.display{
  font-family:'Baloo 2','Malgun Gothic',sans-serif;
  color:var(--navy-2);
  margin:0;
}
#app{ width:100%; max-width:640px; }

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px; gap:10px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand .mark{
  width:38px; height:38px; border-radius:11px; background:var(--navy);
  display:flex; align-items:center; justify-content:center; color:var(--gold);
  font-size:20px; flex-shrink:0;
}
.brand .name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; color:var(--navy-2); line-height:1.15;}
.brand .name small{ display:block; font-family:'Inter',sans-serif; font-weight:500; font-size:11.5px; color:var(--ink-soft); }

.lang-switch{ display:flex; gap:6px; }
.lang-btn{
  border:1.5px solid var(--line); background:var(--paper); border-radius:11px;
  padding:6px 9px; font-size:18px; cursor:pointer; line-height:1;
  display:flex; align-items:center; gap:5px; transition:transform .12s, border-color .12s;
}
.lang-btn span.code{ font-family:'Inter',sans-serif; font-size:10.5px; font-weight:700; color:var(--ink-soft); }
.lang-btn:hover{ transform:translateY(-1px); }
.lang-btn.active{ border-color:var(--navy); background:#EEF3F6; }

.card{
  background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow);
  border:1px solid var(--line); padding:28px 26px; position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:6px;
  background:linear-gradient(90deg, var(--s1), var(--s2), var(--s3));
}

/* ---- language select screen ---- */
.hero{ text-align:center; padding:8px 4px 4px; }
.hero .display{ font-size:26px; font-weight:800; margin-bottom:8px; }
.hero p{ color:var(--ink-soft); font-size:14.5px; margin:0 0 26px; line-height:1.6; }
.flag-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.flag-card{
  border:2px solid var(--line); background:#FCFAF3; border-radius:16px;
  padding:18px 10px; cursor:pointer; text-align:center; transition:.15s;
}
.flag-card:hover{ border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 18px rgba(180,130,30,.18); }
.flag-card .emoji{ font-size:34px; display:block; margin-bottom:8px; }
.flag-card .label{ font-weight:700; font-family:'Baloo 2',sans-serif; font-size:15px; }
.flag-card .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

/* ---- stage progress path ---- */
.path{ display:flex; align-items:center; justify-content:center; gap:6px; margin:0 0 18px; }
.path .node{
  width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px; border:2px solid var(--line); color:var(--ink-soft); background:var(--paper);
}
.path .node.current{ border-color:var(--navy); background:var(--navy); color:#fff; }
.path .node.done{ border-color:var(--green); background:var(--green-bg); color:var(--green); }
.path .bar{ width:26px; height:2px; background:var(--line); }

/* ---- quiz header row ---- */
.quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.stage-chip{
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px; color:#fff;
  padding:6px 12px; border-radius:999px;
}
.stage-chip.s1{ background:var(--s1); }
.stage-chip.s2{ background:var(--s2); }
.stage-chip.s3{ background:var(--s3); }
.progress-text{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
.score-text{ font-size:12.5px; color:var(--gold-dark); font-weight:700; }

.progress-bar{ height:7px; border-radius:999px; background:#EFE9D8; overflow:hidden; margin-bottom:20px;}
.progress-bar > div{ height:100%; border-radius:999px; background:linear-gradient(90deg,var(--gold),var(--gold-dark)); transition:width .25s ease; }

/* ---- question ---- */
.qtext{ font-size:17px; line-height:1.65; margin:6px 0 22px; font-weight:500; }
.qtext .kw{ color:var(--navy); font-weight:800; }

.ox-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.ox-btn{
  border:2.5px solid var(--line); background:#FCFAF3; border-radius:18px; padding:26px 10px;
  font-family:'Baloo 2',sans-serif; font-size:38px; font-weight:800; cursor:pointer; transition:.12s;
}
.ox-btn.o{ color:var(--green); }
.ox-btn.x{ color:var(--red); }
.ox-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.08); }
.ox-btn:disabled{ opacity:.55; cursor:default; }

.opt-list{ display:flex; flex-direction:column; gap:10px; }
.opt-btn{
  text-align:left; border:2px solid var(--line); background:#FCFAF3; border-radius:14px;
  padding:13px 16px; font-size:15px; cursor:pointer; font-family:'Inter',sans-serif; color:var(--ink);
  display:flex; gap:10px; align-items:center; transition:.12s;
}
.opt-btn .lab{ font-family:'Baloo 2',sans-serif; color:var(--navy); font-weight:700; }
.opt-btn:hover:not(:disabled){ border-color:var(--navy); background:#EEF3F6; }
.opt-btn:disabled{ cursor:default; }

.hint-box{
  display:inline-flex; align-items:center; gap:8px; background:#FBF2DE; border:1.5px dashed var(--gold-dark);
  border-radius:12px; padding:9px 14px; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--gold-dark);
  letter-spacing:3px; font-size:19px; margin-bottom:18px;
}
.hint-box .tag{ font-family:'Inter',sans-serif; letter-spacing:0; font-weight:600; font-size:11.5px; color:var(--ink-soft); }
.answer-row{ display:flex; gap:10px; }
.answer-row input{
  flex:1; border:2px solid var(--line); border-radius:12px; padding:13px 14px; font-size:16px;
  font-family:'Inter',sans-serif; outline:none;
}
.answer-row input:focus{ border-color:var(--navy); }
.submit-btn{
  border:none; background:var(--navy); color:#fff; border-radius:12px; padding:0 20px;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; cursor:pointer;
}
.submit-btn:hover{ background:var(--navy-2); }

.feedback{ margin-top:20px; border-radius:14px; padding:16px 18px; font-size:14px; line-height:1.6; }
.feedback.correct{ background:var(--green-bg); color:#1E5E42; border:1px solid #BFE3D2; }
.feedback.wrong{ background:var(--red-bg); color:#7C3225; border:1px solid #F0C9C0; }
.feedback .head{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; margin-bottom:6px; }
.feedback .line{ margin:2px 0; }
.feedback .line b{ color:inherit; }

.next-btn{
  margin-top:18px; width:100%; border:none; background:var(--gold); color:#3A2500;
  padding:14px; border-radius:14px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; cursor:pointer;
}
.next-btn:hover{ background:var(--gold-dark); color:#fff; }

/* ---- result screens ---- */
.result{ text-align:center; padding:10px 4px; }
.result .ring{
  width:130px; height:130px; border-radius:50%; margin:6px auto 18px; display:flex; align-items:center;
  justify-content:center; flex-direction:column; border:8px solid var(--line);
}
.result.pass .ring{ border-color:var(--green); }
.result.fail .ring{ border-color:var(--red); }
.result .ring .pct{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:28px; }
.result .ring .lbl{ font-size:11px; color:var(--ink-soft); }
.result h2{ font-size:22px; margin-bottom:6px; }
.result p{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
.result .cta{
  border:none; padding:14px 22px; border-radius:14px; font-family:'Baloo 2',sans-serif; font-weight:700;
  font-size:15px; cursor:pointer; width:100%;
}
.result.pass .cta{ background:var(--green); color:#fff; }
.result.fail .cta{ background:var(--red); color:#fff; }

.final-badges{ display:flex; justify-content:center; gap:14px; margin:18px 0 22px; }
.badge{ width:64px; height:64px; border-radius:16px; background:var(--navy); color:var(--gold);
  display:flex; align-items:center; justify-content:center; font-size:26px; }

.footnote{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:16px; }
.small-link{ background:none; border:none; color:var(--navy); text-decoration:underline; cursor:pointer; font-size:12.5px; padding:0; }

@media (max-width:420px){
  .card{ padding:22px 18px; }
  .flag-card .emoji{ font-size:28px; }
  .ox-btn{ font-size:30px; padding:20px 8px; }
}
</style>
</head>

노동력", "type": "OX", "question": "'노동력'은 The social rules and operating methods a country sets to decide what, how, and for whom to produce and distribute goods. 이다.", "answer": "X", "points": 1, "feedback_on_wrong": "[Korean] '노동력'은 사람이 어떤 물건을 만들거나 일을 해내기 위해 사용하는 몸과 머리의 모든 힘과 능력(일할 수 있는 힘) / [English] All physical stamina, mental focus, and professional skills that a human uses to work and make things."}, {"stage": 1, "no": 19, "source_no": 19, "word_ko": "상호 의존", "type": "OX", "question": "'상호 의존'은 A close relationship where individuals or groups help and rely on each other because no one can do everything alone. 이다.", "answer": "O", "points": 1, "feedback_on_wrong": "[Korean] '상호 의존'은 개인이나 집단이 혼자서 모든 것을 다 할 수 없기 때문에, 서로 도움을 주고받으며 긴밀하게 기대어 살아가는 관계 / [English] A close relationship where individuals or groups help and rely on each other because no one can do everything alone."}, {"stage": 1, "no": 20, "source_no": 20, "word_ko": "근로자", "type": "OX", "question": "'근로자'는 A close relationship where individuals or groups help and rely on each other because no one can do everything alone. 이다.", "answer": "X", "points": 1, "feedback_on_wrong": "[Korean] '근로자'는 회사나 공장, 가게 등에서 일(노동)을 하고 그 대가로 돈(월급이나 일당)을 받는 사람이에요. / [English] A person who works at a company, factory, or store and receives money (wages or salary) in return for their labor."}], "stage2": [{"stage": 2, "no": 1, "source_no": 21, "word_ko": "권리", "type": "MCQ5", "question": "The right of every child to attend school and receive education without discrimination.", "options": [{"label": "①", "text": "강조되다"}, {"label": "②", "text": "국민 소득"}, {"label": "③", "text": "근로 조건"}, {"label": "④", "text": "문제 발생"}, {"label": "⑤", "text": "권리"}], "answer": "⑤", "points": 2, "feedback_on_wrong": "[Korean] '권리' - 사람으로서 마땅히 누리거나 당당하게 요구할 수 있는 특별한 힘이나 자격이에요. / [English] A special power or entitlement that a person naturally deserves or can rightfully claim as a human being."}, {"stage": 2, "no": 2, "source_no": 22, "word_ko": "임금", "type": "MCQ5", "question": "The money rightfully paid by an employer or company to a worker in return for their hard work and labor.", "options": [{"label": "①", "text": "사용자"}, {"label": "②", "text": "문화 생활"}, {"label": "③", "text": "임금"}, {"label": "④", "text": "사회적 책임"}, {"label": "⑤", "text": "경제성장"}], "answer": "③", "points": 2, "feedback_on_wrong": "[Korean] '임금' - 근로자가 열심히 땀 흘려 일한 대가로 회사나 사장님에게 정당하게 받는 돈이에요. / [English] The money rightfully paid by an employer or company to a worker in return for their hard work and labor."}, {"stage": 2, "no": 3, "source_no": 23, "word_ko": "근로 조건", "type": "MCQ5", "question": "A working environment equipped with proper heating and air conditioning for comfort.", "options": [{"label": "①", "text": "근로 조건"}, {"label": "②", "text": "사용자"}, {"label": "③", "text": "헌법"}, {"label": "④", "text": "경제 규모"}, {"label": "⑤", "text": "임금"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '근로 조건' - 일하는 시간, 쉬는 날, 받는 돈 등 일할 때 서로 지켜야 할 약속과 일하는 환경의 규칙이에요. / [English] Rules and agreements governing work, such as working hours, rest days, wages, and workplace safety."}, {"stage": 2, "no": 4, "source_no": 24, "word_ko": "헌법", "type": "MCQ5", "question": "The supreme and fundamental law of a country that outlines citizens’ fundamental rights and the structure of government.", "options": [{"label": "①", "text": "문화 생활"}, {"label": "②", "text": "경제 규모"}, {"label": "③", "text": "헌법"}, {"label": "④", "text": "생산 능력"}, {"label": "⑤", "text": "확대"}], "answer": "③", "points": 2, "feedback_on_wrong": "[Korean] '헌법' - 우리나라 모든 법 중에서 가장 기본이 되고 으뜸인 법이에요. 국민의 권리와 나라를 운영하는 큰 틀을 적어 놓았어요. / [English] The supreme and fundamental law of a country that outlines citizens’ fundamental rights and the structure of government."}, {"stage": 2, "no": 5, "source_no": 25, "word_ko": "사용자", "type": "MCQ5", "question": "A store manager who signs formal employment contracts and provides legal job opportunities.", "options": [{"label": "①", "text": "삶의 질"}, {"label": "②", "text": "사용자"}, {"label": "③", "text": "근로 조건"}, {"label": "④", "text": "여가 생활"}, {"label": "⑤", "text": "경제성장"}], "answer": "②", "points": 2, "feedback_on_wrong": "[Korean] '사용자' - 근로자를 채용하여 일을 시키고, 그 일에 대한 대가로 임금을 주는 사장님이나 기업가예요. / [English] A business owner, entrepreneur, or manager who hires workers, directs tasks, and pays wages for their work."}, {"stage": 2, "no": 6, "source_no": 26, "word_ko": "사회적 책임", "type": "MCQ5", "question": "The duty of individuals and corporations to contribute to the well-being and development of the broader community beyond mere self-interest.", "options": [{"label": "①", "text": "사회적 책임"}, {"label": "②", "text": "긍정적 역할"}, {"label": "③", "text": "증가"}, {"label": "④", "text": "헌법"}, {"label": "⑤", "text": "여가 생활"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '사회적 책임' - 개인이나 기업이 자기 이익만 챙기지 않고, 사회 전체의 행복과 발전을 위해 마땅히 해야 할 도리와 역할이에요. / [English] The duty of individuals and corporations to contribute to the well-being and development of the broader community beyond mere self-interest."}, {"stage": 2, "no": 7, "source_no": 27, "word_ko": "긍정적 역할", "type": "MCQ5", "question": "A newly opened community library serving as an inspiring reading space and haven for local residents.", "options": [{"label": "①", "text": "긍정적 역할"}, {"label": "②", "text": "임금"}, {"label": "③", "text": "여가 생활"}, {"label": "④", "text": "생산 능력"}, {"label": "⑤", "text": "근로 조건"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '긍정적 역할' - 어떤 사람이나 행동이 모임이나 사회에 좋은 변화를 주고 이로운 도움을 주는 위치와 일이에요. / [English] Beneficial actions or a constructive position taken by a person or organization that brings favorable changes to a group or society."}, {"stage": 2, "no": 8, "source_no": 28, "word_ko": "영향력", "type": "MCQ5", "question": "The power of a person’s words, actions, or ideas to shape the behaviors, attitudes, or situations of others.", "options": [{"label": "①", "text": "지속가능성"}, {"label": "②", "text": "근로 조건"}, {"label": "③", "text": "문제 발생"}, {"label": "④", "text": "삶의 질"}, {"label": "⑤", "text": "영향력"}], "answer": "⑤", "points": 2, "feedback_on_wrong": "[Korean] '영향력' - 어떤 사람의 말이나 행동, 생각이 다른 사람이나 주변 상황을 변화시키는 힘이에요. / [English] The power of a person’s words, actions, or ideas to shape the behaviors, attitudes, or situations of others."}, {"stage": 2, "no": 9, "source_no": 29, "word_ko": "강조되다", "type": "MCQ5", "question": "A teacher marking stars beside core concepts that students must master before exams.", "options": [{"label": "①", "text": "경제성장"}, {"label": "②", "text": "국민 소득"}, {"label": "③", "text": "문제 발생"}, {"label": "④", "text": "강조되다"}, {"label": "⑤", "text": "확대"}], "answer": "④", "points": 2, "feedback_on_wrong": "[Korean] '강조되다' - 어떤 내용이나 생각이 매우 중요하게 여겨져서 특별히 더 힘주어 드러나다. / [English] To be highlighted or given special importance because a concept or topic is considered crucial."}, {"stage": 2, "no": 10, "source_no": 30, "word_ko": "지속가능성", "type": "MCQ5", "question": "The capacity to meet present needs and live happily without depleting resources or harming future generations.", "options": [{"label": "①", "text": "임금"}, {"label": "②", "text": "삶의 질"}, {"label": "③", "text": "지속가능성"}, {"label": "④", "text": "헌법"}, {"label": "⑤", "text": "사회적 책임"}], "answer": "③", "points": 2, "feedback_on_wrong": "[Korean] '지속가능성' - 미래 세대가 쓸 자원이나 환경을 망치지 않으면서, 지금 우리도 오랫동안 행복하게 잘 살아갈 수 있는 능력이나 상태예요. / [English] The capacity to meet present needs and live happily without depleting resources or harming future generations."}, {"stage": 2, "no": 11, "source_no": 31, "word_ko": "경제성장", "type": "MCQ5", "question": "Paved highways, modern subways, and high-rise apartments replacing old mud roads and thatched huts.", "options": [{"label": "①", "text": "경제성장"}, {"label": "②", "text": "문제 발생"}, {"label": "③", "text": "근로 조건"}, {"label": "④", "text": "삶의 질"}, {"label": "⑤", "text": "국민 소득"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '경제성장' - 한 나라의 살림살이가 커지고, 나라 안에서 만들어 내는 물건과 서비스가 늘어나 생활이 더 풍요로워지는 것이에요. / [English] The expansion of a country’s livelihood and wealth, where the total output of goods and services steadily increases, enriching people’s living standards."}, {"stage": 2, "no": 12, "source_no": 32, "word_ko": "생산 능력", "type": "MCQ5", "question": "The maximum volume of goods or services that factories, machines, and workers can produce within a given time.", "options": [{"label": "①", "text": "사용자"}, {"label": "②", "text": "문화 생활"}, {"label": "③", "text": "생산 능력"}, {"label": "④", "text": "강조되다"}, {"label": "⑤", "text": "증가"}], "answer": "③", "points": 2, "feedback_on_wrong": "[Korean] '생산 능력' - 공장, 사람, 기계 등이 정해진 시간 동안 물건이나 서비스를 만들어 낼 수 있는 힘의 크기예요. / [English] The maximum volume of goods or services that factories, machines, and workers can produce within a given time."}, {"stage": 2, "no": 13, "source_no": 33, "word_ko": "경제 규모", "type": "MCQ5", "question": "The immense total financial volume of a nation’s combined annual export and import trade.", "options": [{"label": "①", "text": "사회적 책임"}, {"label": "②", "text": "사용자"}, {"label": "③", "text": "영향력"}, {"label": "④", "text": "경제 규모"}, {"label": "⑤", "text": "근로 조건"}], "answer": "④", "points": 2, "feedback_on_wrong": "[Korean] '경제 규모' - 한 나라 안에서 사고파는 돈, 물건, 서비스의 전체 덩치나 크기를 말해요. / [English] The overall physical size and monetary volume of goods, services, and transactions within a nation’s economy."}, {"stage": 2, "no": 14, "source_no": 34, "word_ko": "국민 소득", "type": "MCQ5", "question": "The total amount of money earned by all citizens of a country through work and production over a certain period (usually one year).", "options": [{"label": "①", "text": "국민 소득"}, {"label": "②", "text": "강조되다"}, {"label": "③", "text": "사용자"}, {"label": "④", "text": "지속가능성"}, {"label": "⑤", "text": "권리"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '국민 소득' - 한 나라의 국민들이 일정 기간(보통 1년) 동안 일해서 벌어들인 돈을 모두 합한 것이에요. / [English] The total amount of money earned by all citizens of a country through work and production over a certain period (usually one year)."}, {"stage": 2, "no": 15, "source_no": 35, "word_ko": "증가", "type": "MCQ5", "question": "The number of consecutive push-ups someone can do increasing from 10 to 20 after daily exercise.", "options": [{"label": "①", "text": "증가"}, {"label": "②", "text": "여가 생활"}, {"label": "③", "text": "사용자"}, {"label": "④", "text": "임금"}, {"label": "⑤", "text": "확대"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '증가' - 수량이나 양, 크기, 숫자 등이 전보다 더 많아지거나 불어나는 것이에요. / [English] The state of quantities, amounts, sizes, or numbers becoming greater or expanding compared to before."}, {"stage": 2, "no": 16, "source_no": 36, "word_ko": "확대", "type": "MCQ5", "question": "Enlarging, broadening, or spreading the physical size, scope, influence, or territory of something.", "options": [{"label": "①", "text": "삶의 질"}, {"label": "②", "text": "헌법"}, {"label": "③", "text": "문제 발생"}, {"label": "④", "text": "경제 규모"}, {"label": "⑤", "text": "확대"}], "answer": "⑤", "points": 2, "feedback_on_wrong": "[Korean] '확대' - 모양, 규모, 범위, 세력 등을 전보다 더 크게 넓히거나 펼치는 것이에요. / [English] Enlarging, broadening, or spreading the physical size, scope, influence, or territory of something."}, {"stage": 2, "no": 17, "source_no": 37, "word_ko": "삶의 질", "type": "MCQ5", "question": "Enjoying leisurely warm dinners with family every evening instead of routinely working overtime late into the night.", "options": [{"label": "①", "text": "증가"}, {"label": "②", "text": "사회적 책임"}, {"label": "③", "text": "헌법"}, {"label": "④", "text": "삶의 질"}, {"label": "⑤", "text": "경제성장"}], "answer": "④", "points": 2, "feedback_on_wrong": "[Korean] '삶의 질' - 단순히 돈이 많은 것을 넘어, 사람이 얼마나 건강하고, 안전하며, 마음 편하고 행복하게 살아가는가의 수준이에요. / [English] The standard of human well-being, measured not just by financial wealth, but by health, safety, comfort, and happiness."}, {"stage": 2, "no": 18, "source_no": 38, "word_ko": "여가 생활", "type": "MCQ5", "question": "Pleasurable activities, hobbies, or rest engaged in du : "O", "points": 1, "feedback_on_wrong": "[Korean] '선택하다'는 여럿 중에서 목적이나 마음에 드는 것을 하나 골라잡다 / [中文] 从多个事物或方案中挑出符合自己目的或心意的一个。"}, {"stage": 1, "no": 7, "source_no": 7, "word_ko": "소득", "type": "OX", "question": "'소득'은 在公司、工厂、商店等地方付出劳动，并以此换取报酬（工资或薪水）的人。 이다.", "answer": "X", "points": 1, "feedback_on_wrong": "[Korean] '소득'은 개인이나 가정이 일하거나 돈을 투자하여 정기적 또는 비정기적으로 얻는 모든 돈이나 수입 / [中文] 个人或家庭通过劳动、提供服务或投资定期、不定期获得的所有金钱与报酬。"}, {"stage": 1, "no": 8, "source_no": 8, "word_ko": "생산하다", "type": "OX", "question": "'생산하다'는 制造人们日常生活所需的物品，或提供便利有益的服务。 이다.", "answer": "O", "points": 1, "feedback_on_wrong": "[Korean] '생산하다'는 사람들의 생활에 필요한 물건을 새롭게 만들어 내거나 편리한 서비스를 제공하는 것 / [中文] 制造人们日常生活所需的物品，或提供便利有益的服务。"}, {"stage": 1, "no": 9, "source_no": 9, "word_ko": "이윤", "type": "OX", "question": "'이윤'은 为了取得更好的成果、吸引更多顾客或获得利润，两个以上的个人或企业相互较量实力。 이다.", "answer": "X", "points": 1, "feedback_on_wrong": "[Korean] '이윤'은 기업이나 가게가 물건을 판 전체 금액에서 재료비, 인건비 등 들어간 모든 비용을 빼고 순수하게 남은 돈 / [中文] 企业或店铺从全部销售额中扣除原材料费、房租、人工资等各项成本后纯剩下的钱。"}, {"stage": 1, "no": 10, "source_no": 10, "word_ko": "경제 주체", "type": "OX", "question": "'경제 주체'는 根据自身意愿和计划，自主开展物品制造、购买和分配等经济活动的个人或组织（家庭、企业、政府）。 이다.", "answer": "O", "points": 1, "feedback_on_wrong": "[Korean] '경제 주체'는 물건을 만들고, 사고, 나누는 경제활동을 자신의 뜻에 따라 스스로 해 나가는 사람이나 조직(가계, 기업, 정부 등) / [中文] 根据自身意愿和计划，自主开展物品制造、购买和分配等经济活动的个人或组织（家庭、企业、政府）。"}, {"stage": 1, "no": 11, "source_no": 11, "word_ko": "가계", "type": "OX", "question": "'가계'는 以共同生活的家庭成员为核心，通过劳动获得收入并开展日常生活消费的经济单位。 이다.", "answer": "O", "points": 1, "feedback_on_wrong": "[Korean] '가계'는 함께 생활하는 가족을 중심으로 소득을 얻어 살림살이에 필요한 물건이나 서비스를 소비하는 경제 주체 / [中文] 以共同生活的家庭成员为核心，通过劳动获得收入并开展日常生活消费的经济单位。"}, {"stage": 1, "no": 12, "source_no": 12, "word_ko": "기업", "type": "OX", "question": "'기업'은 生产日常生活所需的物品或提供便利服务并向市场销售以获取利润的经济组织（公司、工厂等）。 이다.", "answer": "O", "points": 1, "feedback_on_wrong": "[Korean] '기업'은 사람들의 생활에 필요한 물건이나 편리한 서비스를 만들어 팔아 이윤을 얻는 경제 조직(회사, 공장 등) / [中文] 生产日常生活所需的物品或提供便利服务并向市场销售以获取利润的经济组织（公司、工厂等）。"}, {"stage": 1, "no": 13, "source_no": 13, "word_ko": "소비  "answer": "③", "points": 2, "feedback_on_wrong": "[Korean] '헌법' - 우리나라 모든 법 중에서 가장 기본이 되고 으뜸인 법이에요. 국민의 권리와 나라를 운영하는 큰 틀을 적어 놓았어요. / [中文] 一个国家最高、最根本的法律，规定了国民的基本权利以及国家治理的根本原则。"}, {"stage": 2, "no": 5, "source_no": 25, "word_ko": "사용자", "type": "MCQ5", "question": "规范经营店铺、与打工人员正式签订劳动合同并提供就业岗位的经营者。", "options": [{"label": "①", "text": "삶의 질"}, {"label": "②", "text": "사용자"}, {"label": "③", "text": "근로 조건"}, {"label": "④", "text": "여가 생활"}, {"label": "⑤", "text": "경제성장"}], "answer": "②", "points": 2, "feedback_on_wrong": "[Korean] '사용자' - 근로자를 채용하여 일을 시키고, 그 일에 대한 대가로 임금을 주는 사장님이나 기업가예요. / [中文] 雇佣劳动者并安排工作，为其付出的劳动支付相应工资报酬的老板或企业主。"}, {"stage": 2, "no": 6, "source_no": 26, "word_ko": "사회적 책임", "type": "MCQ5", "question": "个人或企业不仅追求自身利益，更要为整个社会的福祉与进步承担起应尽的义务与道德担当。", "options": [{"label": "①", "text": "사회적 책임"}, {"label": "②", "text": "긍정적 역할"}, {"label": "③", "text": "증가"}, {"label": "④", "text": "헌법"}, {"label": "⑤", "text": "여가 생활"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '사회적 책임' - 개인이나 기업이 자기 이익만 챙기지 않고, 사회 전체의 행복과 발전을 위해 마땅히 해야 할 도리와 역할이에요. / [中文] 个人或企业不仅追求自身利益，更要为整个社会的福祉与进步承担起应尽的义务与道德担当。"}, {"stage": 2, "no": 7, "source_no": 27, "word_ko": "긍정적 역할", "type": "MCQ5", "question": "社区新建的图书馆成为居民汲取知识、放松身心的文化驿站。", "options": [{"label": "①", "text": "긍정적 역할"}, {"label": "②", "text": "임금"}, {"label": "③", "text": "여가 생활"}, {"label": "④", "text": "생산 능력"}, {"label": "⑤", "text": "근로 조건"}], "answer": "①", "points": 2, "feedback_on_wrong": "[Korean] '긍정적 역할' - 어떤 사람이나 행동이 모임이나 사회에 좋은 변화를 주고 이로운 도움을 주는 위치와 일이에요. / [中文] 某个人、组织或某种行为为集体和社会带来良性变化和有益帮助的表现与担当。"}, {"stage": 2, "no": 8, "source_no": 28, "word_ko": "영향력", "type": "MCQ5", "question": "一个人的言行举止或思想理念对他人及周围环境产生启发、促成改变的力量。", "options": [{"label": "①", "text": "지속가능성"}, {"label": "②", "text": "근로 조건"}, {"label": "③", "text": "문제 발생"}, {"label": "④", "text": "삶의 질"}, {"label": "⑤", "text": "영향력"}], "answer": "⑤", "points": 2, "feedback_on_wrong": "[Korean] '영향력' - 어떤 사람의 말이나 행동, 생각이 다른 사람이나 주변 상황을 변화시키는 힘이에요. function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];

}

}

  if(currentScreen === 'lang') return renderLangSelect();
  if(currentScreen === 'question') return renderQuestion();
  if(currentScreen === 'stageResult') return renderStageResult(state._lastStagePass, state._lastStagePercent, state._lastStageScore, state._lastStageMax);
  if(currentScreen === 'final') return renderFinal();
}

function beginStage(stage){
  state.stage = stage;
  state.order = shuffle([...Array(20).keys()]);
  state.idx = 0;
  state.correctCount = 0;
  state.score = 0;
  state.answered = false;
  currentScreen = 'question';
  renderQuestion();
}

function stageClass(stage){ return stage===1?'s1':stage===2?'s2':'s3'; }

function renderQuestion(){
  const q = currentQuestion();
  const T = t();
  const pct = Math.round((state.idx)/20*100);

  let bodyHTML = '';
  if(q.type === 'OX'){
    bodyHTML = `
      <div class="qtext">${q.question}</div>
      <div class="ox-row">
        <button class="ox-btn o" id="btnO" onclick="answer('O')">O</button>
        <button class="ox-btn x" id="btnX" onclick="answer('X')">X</button>
      </div>`;
  } else if(q.type === 'MCQ5'){
    const opts = q.options.map(o => `
      <button class="opt-btn" data-label="${o.label}" onclick="answer('${o.label}')">
        <span class="lab">${o.label}</span><span>${o.text}</span>
      </button>`).join('');
    bodyHTML = `
      <div class="qtext">${q.question}</div>
      <div class="opt-list" id="optList">${opts}</div>`;
  } else if(q.type === 'CHOSEONG'){
    bodyHTML = `
      <div class="qtext">${q.question}</div>
      <div class="hint-box"><span class="tag">${T.hintTag}</span> ${q.hint_choseong}</div>
      <div class="answer-row">
        <input id="choseongInput" type="text" placeholder="${T.placeholder}" autocomplete="off"
          onkeydown="if(event.key==='Enter'){submitChoseong();}">
        <button class="submit-btn" onclick="submitChoseong()">${T.submit}</button>
      </div>`;
  }

  render(`
    ${topbarHTML()}
    <div class="card">
      ${pathHTML()}
      <div class="quiz-head">
        <span class="stage-chip ${stageClass(state.stage)}">${T.stageNames[state.stage]}</span>
        <span class="progress-text">${T.progress(state.idx+1)}</span>
        <span class="score-text">${T.score(state.score, STAGE_POINTS[state.stage])}</span>
      </div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      ${bodyHTML}
      <div id="feedbackArea"></div>
    </div>
    <div class="footnote">${T.langSwitchHint}</div>
  `);
}

function disableAllInputs(){
  document.querySelectorAll('.ox-btn, .opt-btn, .submit-btn').forEach(b => b.disabled = true);
  const inp = document.getElementById('choseongInput');
  if(inp) inp.disabled = true;
}

function markChoice(givenLabelOrOX, correctLabelOrOX, isOX){
  if(isOX){
    const map = {O:'btnO', X:'btnX'};
    const givenBtn = document.getElementById(map[givenLabelOrOX]);
    const correctBtn = document.getElementById(map[correctLabelOrOX]);
    if(correctBtn) correctBtn.style.outline = '3px solid var(--green)';
    if(givenBtn && givenLabelOrOX !== correctLabelOrOX) givenBtn.style.outline = '3px solid var(--red)';
  } else {
    document.querySelectorAll('.opt-btn').forEach(btn=>{
      if(btn.dataset.label === correctLabelOrOX) btn.style.borderColor = 'var(--green)';
      if(btn.dataset.label === givenLabelOrOX && givenLabelOrOX !== correctLabelOrOX) btn.style.borderColor = 'var(--red)';
    });
  }
}

function answer(given){
  if(state.answered) return;
  state.answered = true;
  const q = currentQuestion();
  const correct = (given === q.answer);
  finalizeAnswer(q, correct, given, q.type === 'OX');
}

function submitChoseong(){
  if(state.answered) return;
  const inp = document.getElementById('choseongInput');
  const raw = inp.value || '';
  const norm = s => s.replace(/\s+/g,'').trim();
  const q = currentQuestion();
  const correct = norm(raw) === norm(q.answer);
  state.answered = true;
  inp.disabled = true;
  inp.style.borderColor = correct ? 'var(--green)' : 'var(--red)';
  finalizeAnswer(q, correct, raw, false);
}

function finalizeAnswer(q, correct, given, isOX){
  disableAllInputs();
  if(q.type !== 'CHOSEONG') markChoice(given, q.answer, isOX);
  if(correct){
    state.correctCount += 1;
    state.score += q.points;
  }
  const T = t();
  const fbDiv = document.getElementById('feedbackArea');
  let html = '';
  if(correct){
    html = `<div class="feedback correct"><div class="head">${T.correct}</div></div>`;
  } else {
    html = `<div class="feedback wrong"><div class="head">${T.wrong}</div>
      <div class="line">${escapeHTML(q.feedback_on_wrong)}</div></div>`;
  }
  fbDiv.innerHTML = html;
  const isLast = state.idx === 19;
  const btn = document.createElement('button');
  btn.className = 'next-btn';
  btn.textContent = isLast ? T.seeResult : T.next;
  btn.onclick = isLast ? finishStage : nextQuestion;
  fbDiv.appendChild(btn);
}

function escapeHTML(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function nextQuestion(){
  state.idx += 1;
  state.answered = false;
  renderQuestion();
}

function finishStage(){
  const percent = Math.round((state.correctCount/20)*100);
  const pass = percent >= PASS_PERCENT;
  if(pass){
    state.stageStatus[state.stage] = 'done';
    if(state.stage < 3) state.stageStatus[state.stage+1] = 'active';
  }
  state._lastStagePass = pass;
  state._lastStagePercent = percent;
  state._lastStageScore = state.score;
  state._lastStageMax = STAGE_POINTS[state.stage];
  currentScreen = 'stageResult';
  renderStageResult(pass, percent, state.score, STAGE_POINTS[state.stage]);
}

function renderStageResult(pass, percent, score, max){
  const T = t();
  const cls = pass ? 'pass' : 'fail';
  const title = pass ? T.stagePassTitle : T.stageFailTitle;
  const sub = pass ? T.stagePassSub(percent) : T.stageFailSub(percent);
  const ctaLabel = pass ? (state.stage < 3 ? T.nextStageBtn : null) : T.retryBtn;

  render(`
    ${topbarHTML()}
    <div class="card">
      ${pathHTML()}
      <div class="result ${cls}">
        <div class="ring"><div class="pct">${percent}%</div><div class="lbl">${T.score(score,max)}</div></div>
        <h2>${title}</h2>
        <p>${sub}</p>
        ${pass && state.stage === 3
          ? `<button class="cta" style="background:var(--navy);color:#fff" onclick="goFinal()">🎉</button>`
          : `<button class="cta" onclick="${pass ? `beginStage(${state.stage+1})` : `beginStage(${state.stage})`}">${pass ? T.nextStageBtn : T.retryBtn}</button>`
        }
      </div>
    </div>
  `);
}

function goFinal(){
  currentScreen = 'final';
  renderFinal();
}

function renderFinal(){
  const T = t();
  render(`
    ${topbarHTML()}
    <div class="card">
      <div class="result pass">
        <div class="final-badges">
          <div class="badge">🇴/✕</div>
          <div class="badge">①-⑤</div>
          <div class="badge">ㄱㄴㄷ</div>
        </div>
        <h2>${T.finalTitle}</h2>
        <p>${T.finalSub}</p>
        <button class="cta" style="background:var(--gold);color:#3A2500" onclick="restartAll()">${T.restart}</button>
      </div>
    </div>
  `);
}

function restartAll(){
  state.lang = null;
  state.stage = 1;
  state.stageStatus = {1:'locked', 2:'locked', 3:'locked'};
  currentScreen = 'lang';
  renderLangSelect();
}

// expose for inline handlers
window.chooseLang = chooseLang;
window.switchLang = switchLang;
window.beginStage = beginStage;
window.answer = answer;
window.submitChoseong = submitChoseong;
window.nextQuestion = nextQuestion;
window.finishStage = finishStage;
window.goFinal = goFinal;
window.restartAll = restartAll;

renderLangSelect();
</script>
</body>
</html>
